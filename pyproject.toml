[project]
name = "faceoff"
version = "2.12.0"
description = "Local GPU-accelerated face swapping application"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
# 3.12 floor: onnxruntime-gpu resolves to a cu13 build only on 3.12+, which lets
# the whole CUDA stack come from torch's cu13 wheels (see the GPU block below).
# 3.13 ceiling: numpy is pinned <2.0 and numpy 1.26.4 ships no cp313 wheels.
requires-python = ">=3.12,<3.13"
dependencies = [
    # Deep Learning & GPU
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "onnxruntime-gpu>=1.23.0",
    "onnx>=1.19.0",
    "onnxoptimizer>=0.3.13",

    # Face detection / swapping
    "insightface>=0.7.3",

    # CV / image processing
    "opencv-python>=4.10.0,<4.11.0",
    "numpy>=1.26,<2.0",
    "Pillow>=12.2.0,<13.0",
    "albumentations>=2.0.8",
    "scikit-image>=0.22.0",

    "imageio>=2.33.0,<2.35.0",
    "imageio-ffmpeg>=0.6.0",
    "ffmpeg-python>=0.2.0",

    # Enhancement models
    "realesrgan>=0.3.0",
    "gfpgan>=1.3.8",
    "basicsr>=1.4.2",
    "facexlib>=0.3.0",
    "transformers>=4.36.0",
    "codeformer-pip>=0.0.4",

    # Performance / GPU acceleration
    # ORT 1.22+ TensorRT EP links against libnvinfer.so.10 — TRT 11 is incompatible
    # (it ships libnvinfer.so.11, and the EP silently drops out of the provider
    # list). The <11 cap is load-bearing; TRT 11 is released, so do not remove it.
    "tensorrt>=10.9,<11",
    # No nvidia-*-cu12 pins: on 3.12 ORT resolves to a cu13 build whose .so files
    # NEED libcublas.so.13 / libcudart.so.13 / libcufft.so.12 / libnvrtc.so.13 —
    # all supplied by torch's cu13 wheels under nvidia/cu13/lib. The cu12 wheels
    # export different sonames (e.g. libcufft.so.11) and satisfied nothing here.
    # cuDNN comes from nvidia-cudnn-cu13 at the nvidia/cudnn/lib path that
    # utils/onnx_providers.py preloads. Restoring a 3.10/3.11 floor would pull a
    # cu12 ORT build and require those pins back.
    "pynvvideocodec>=2.1.0",  # Wave 5 NVDEC; runtime falls back to FFmpeg if unavailable

    # UI / web server
    "gradio>=5.49.0",
    "uvicorn>=0.38.0",
    "fastapi>=0.121.0",

    # Core utilities
    "PyYAML>=6.0",
    "tqdm>=4.66.0",
    "gdown>=5.0.0",
    "lpips>=0.1.4",
    "python-magic>=0.4.14",

    # Test tooling (always installed)
    "pytest>=8.0,!=8.4.0",
    "pytest-cov>=5.0",
]

[dependency-groups]
# Lint tooling for the pre-commit gate in CLAUDE.md. Installed by `uv sync`
# (uv syncs the `dev` group by default) but never shipped to consumers.
dev = [
    "black>=26.5.1",
    "isort>=8.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "processing", "ui", "utils"]

[tool.isort]
# Without this, isort wraps at 79 cols and black rewraps at 88 — the two fight
# and the CLAUDE.md lint gate can never pass.
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--tb=short",
    "-ra",
    "--strict-markers",
]
markers = [
    "unit: Unit tests (fast, isolated, no GPU required)",
    "integration: Integration tests (may require GPU or external resources)",
    "slow: Slow tests (processing large files)",
    "gpu: Tests that require CUDA GPU",
    "skip_ci: Tests to skip in CI environment",
]
log_cli = true
log_cli_level = "WARNING"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["core", "processing", "utils", "ui"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "main.py",
]
branch = true

[tool.coverage.report]
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "except ImportError:",
    "pass",
]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"
