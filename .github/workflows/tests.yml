name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run isort --check --diff .
      - run: uv run black --check .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: system deps (documented in README platform notes)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libmagic1 gifsicle
      - run: uv sync
      - name: unit tests (CPU — gpu-marked tests auto-skip without CUDA)
        run: uv run pytest tests/unit/ -q
